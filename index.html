<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code is cheap. Design is not.</title>
<meta name="description" content="How I work with coding agents. A JSHeroes meetup talk by Razvan Timis.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Inter:wght@400;600&family=Sora:wght@800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="deck.css">
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #0B0C10; }
#stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: center; }
#stage > section { position: absolute; inset: 0; width: 1920px; height: 1080px; display: none; }
#stage > section.on { display: flex; }
#stage > section.on[data-transition="fade"] { animation: fadein .4s ease-out; }
@keyframes fadein { from { opacity: 0; } }
aside { display: none; }
x-icon { display: inline-flex; align-items: center; justify-content: center; line-height: 1; }
x-shape[kind="ellipse"] { display: block; box-sizing: border-box; border-radius: 50%; }
#notes { position: fixed; left: 0; right: 0; bottom: 0; max-height: 40vh; overflow: auto; box-sizing: border-box; padding: 16px 24px 40px; background: rgba(21, 23, 30, .96); color: #F5F2EA; font: 18px/1.5 Inter, Arial, sans-serif; display: none; }
body.notes #notes { display: block; }
#count { position: fixed; right: 16px; bottom: 12px; font: 14px 'JetBrains Mono', monospace; color: #8A8F9C; }
#help { position: fixed; left: 16px; bottom: 12px; font: 14px 'JetBrains Mono', monospace; color: #8A8F9C; }
</style>
</head>
<body>
<div id="stage" aria-live="polite"></div>
<div id="notes"></div>
<div id="help">← → move · N notes · F fullscreen</div>
<div id="count"></div>
<script>
customElements.define('x-icon', class extends HTMLElement {
  connectedCallback() {
    const name = this.getAttribute('name').replace(/([a-z])([A-Z])/g, '$1-$2').toLowerCase();
    this.innerHTML = `<i class="ph-bold ph-${name}" aria-hidden="true"></i>`;
    this.style.fontSize = getComputedStyle(this).height;
  }
});

const stage = document.getElementById('stage');
const notes = document.getElementById('notes');
const count = document.getElementById('count');
let slides = [];
let current = 0;

function fit() {
  const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
}

function show(index) {
  current = Math.max(0, Math.min(slides.length - 1, index));
  slides.forEach((slide, i) => slide.classList.toggle('on', i === current));
  const slide = slides[current];
  slide.querySelectorAll('svg').forEach(svg => svg.setCurrentTime && svg.setCurrentTime(0));
  slide.querySelectorAll('x-icon').forEach(icon => { icon.style.fontSize = getComputedStyle(icon).height; });
  notes.textContent = slide.querySelector('aside')?.textContent ?? '';
  count.textContent = `${current + 1} / ${slides.length}`;
  history.replaceState(null, '', `#${current + 1}`);
}

addEventListener('keydown', event => {
  if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(event.key)) show(current + 1);
  else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(event.key)) show(current - 1);
  else if (event.key === 'Home') show(0);
  else if (event.key === 'End') show(slides.length - 1);
  else if (event.key === 'n' || event.key === 'N') document.body.classList.toggle('notes');
  else if (event.key === 'f' || event.key === 'F') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  else return;
  event.preventDefault();
});
addEventListener('click', event => {
  if (event.target.closest('a, #notes')) return;
  show(current + (event.clientX > innerWidth / 2 ? 1 : -1));
});
let touchX = null;
addEventListener('touchstart', event => { touchX = event.touches[0].clientX; }, { passive: true });
addEventListener('touchend', event => {
  const dx = event.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 40) show(current + (dx < 0 ? 1 : -1));
});
addEventListener('resize', fit);

(async () => {
  const deck = await (await fetch('deck.json')).json();
  const html = await Promise.all(deck.order.map(async id => {
    const response = await fetch(`slides/${id}.html`);
    if (!response.ok) throw new Error(`slide ${id}: HTTP ${response.status}`);
    return response.text();
  }));
  stage.innerHTML = html.join('\n');
  slides = [...stage.querySelectorAll(':scope > section')];
  fit();
  show((parseInt(location.hash.slice(1), 10) || 1) - 1);
})();
</script>
</body>
</html>
